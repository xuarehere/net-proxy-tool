<text x="466" y="382" class="card-sub">写入配置前先捕获文件与权限快照</text>
<line x1="466" y1="396" x2="778" y2="396" stroke="#e2e8f0"/>
<text x="466" y="420" class="card-bullet">• 快照存于 ~/.local/state/net-proxy-tool/</text>
<text x="466" y="444" class="card-bullet">• 关闭后在新开 login shell 逐项核验恢复</text>
</g>
