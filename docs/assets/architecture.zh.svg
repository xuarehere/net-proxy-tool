<text x="36" y="42" class="title">net-proxy-tool v1.5.0 — 控制流与代理流量全景架构</text>
<text x="36" y="66" class="subtitle">虚线表示管理配置、节点编排与只读 MCP 诊断；实线表示隔离后的应用流量经 HTTP 代理网关到达目标服务。</text>
