  .hero-title { font-size: 16px; font-weight: 700; fill: #ffffff; }
  .hero-sub { font-size: 12px; font-weight: 500; fill: #ccfbf1; }
  .hero-bullet { font-size: 11.5px; font-weight: 500; fill: #ecfdf5; }
