<text x="64" y="618" class="card-bullet">供 Kiro / Agent 调用 · 严禁写入配置</text>
<text x="64" y="638" class="card-bullet">list_gateways · check_* · run_with_proxy</text>
</g>
<g filter="url(#card-shadow)">
<rect x="446" y="170" width="348" height="144" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<rect x="446" y="170" width="6" height="144" rx="3" fill="#0f766e"/>
<text x="466" y="196" class="card-title">本机沙箱子进程</text>
<text x="466" y="218" class="card-sub">父进程与系统代理设置保持零改动</text>
<line x1="466" y1="232" x2="778" y2="232" stroke="#e2e8f0"/>
<text x="466" y="256" class="card-bullet">• HTTP_PROXY / NO_PROXY 仅限子进程或代码块</text>
<text x="466" y="280" class="card-bullet">• 超时或退出后完整终止进程树并清理现场</text>
</g>
<g filter="url(#card-shadow)">
<rect x="446" y="334" width="348" height="144" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
