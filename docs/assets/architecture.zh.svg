<rect x="866" y="130" width="320" height="560" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-opacity="0.7" fill-opacity="0.65"/>
<text x="880" y="152" class="col-hdr">3. 代理网关与对比探测</text>
<text x="1228" y="152" class="col-hdr">4. 目标服务</text>
