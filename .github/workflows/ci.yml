name: Cross-Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Automated Test Suite (Zero Dependencies)
        run: |
          python test/test_cross_platform.py

  sanitization-audit:
    name: Sensitive Data & Secret Leakage Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Zero Private IPs & Credentials
        run: |
          echo "Scanning for internal subnet patterns..."
          if grep -rnE "10\.192\.41" . --exclude="*.git*" --exclude="config.json" ; then
            echo "::error::Sensitive IP detected in codebase!"
            exit 1
          fi
          echo "Data sanitization check: PASSED"
