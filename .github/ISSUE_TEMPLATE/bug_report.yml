name: Bug Report
description: Report an issue or unexpected behavior in net-proxy-tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue! Please provide as much relevant detail as possible.
  - type: input
    id: environment
    attributes:
      label: Operating System & Architecture
      description: e.g., Ubuntu 22.04 (x86_64), macOS Sonoma (ARM64), Windows 11
      placeholder: Ubuntu 22.04 x86_64
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: e.g., Python 3.10.12
      placeholder: Python 3.10
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: Clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps.
      placeholder: |
        1. Start web console with ./web/start.sh
        2. Register node ...
        3. Click Turn On
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Server Logs
      description: Paste relevant logs here (make sure to sanitize private IPs or credentials).
      render: shell
