version: "3.8"

services:
  net-proxy-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: net-proxy-tool
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      # 挂载宿主机配置与审计日志 (按需挂载 config.json)
      - ./config.json:/app/config.json:rw
      - ./data:/app/data:rw
      # 按需只读挂载宿主机 SSH 公私钥用于免密管理目标节点
      # - ~/.ssh:/root/.ssh:ro
    environment:
      - PYTHONUNBUFFERED=1
